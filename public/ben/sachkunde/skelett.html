<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knochen beschriften</title>
  <link rel="icon" type="image/svg+xml" href="../ips/favicon.svg" />
  <link rel="apple-touch-icon" href="../ips/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root {
      --bg: #e8f4f8; --bg-card: #ffffff; --text: #2d3436; --text-muted: #636e72;
      --correct: #00b894; --correct-bg: #e6f9f3; --wrong: #e17055;
      --accent: #6c5ce7; --accent-light: #a29bfe;
      --font: 'Nunito', system-ui, sans-serif; --radius: 16px;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 18px; min-height: 100dvh; padding: 0 0 20px 0; }
    .top-bar { background: var(--accent); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .top-bar a { color: white; text-decoration: none; font-weight: 700; font-size: 22px; }
    .top-bar h1 { font-size: 17px; font-weight: 700; }
    .content { max-width: 500px; margin: 0 auto; padding: 20px 16px; }
    .intro { background: var(--bg-card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; font-size: 16px; color: var(--text-muted); }

    .word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; justify-content: center; }
    .word-bank .word {
      background: var(--bg-card); border: 2px solid var(--accent-light); border-radius: 10px;
      padding: 6px 14px; font-weight: 700; font-size: 15px; cursor: grab;
      user-select: none; transition: all 0.2s;
    }
    .word-bank .word:active { cursor: grabbing; transform: scale(0.95); }
    .word-bank .word.used { opacity: 0.3; pointer-events: none; border-color: var(--correct); }

    .skeleton-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    .skeleton-container svg { width: 100%; height: auto; }

    .label-slot {
      position: absolute; display: flex; align-items: center; gap: 4px;
    }
    .label-slot .slot-line {
      width: 30px; height: 2px; background: var(--accent-light); flex-shrink: 0;
    }
    .label-slot .slot-box {
      min-width: 100px; height: 32px; border: 2px dashed var(--accent-light); border-radius: 8px;
      background: rgba(248,246,255,0.9); display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
      transition: all 0.2s; padding: 0 8px;
    }
    .label-slot .slot-box.filled { border-style: solid; border-color: var(--accent); color: var(--text); background: var(--bg-card); }
    .label-slot .slot-box.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
    .label-slot .slot-box.wrong { border-color: var(--wrong); background: #fde8e3; }
    .label-slot.left { flex-direction: row-reverse; }

    #progress { font-weight: 700; font-size: 16px; color: var(--accent); text-align: center; padding: 16px; }
    #congrats { display: none; text-align: center; font-weight: 800; font-size: 20px; color: var(--correct); padding: 16px; }
    #congrats.show { display: block; }

    .nav-links { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
    .nav-links a { background: var(--accent); color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="./">&larr;</a>
  <h1>Knochen beschriften</h1>
</div>

<div class="content">
  <div class="intro">
    Tippe auf einen Knochen-Namen, dann auf die richtige Stelle am Skelett!
  </div>

  <div class="word-bank" id="wordBank"></div>

  <div class="skeleton-container" id="skelContainer">
    <!-- Simple skeleton SVG -->
    <svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
      <!-- Head -->
      <ellipse cx="150" cy="45" rx="28" ry="35" fill="none" stroke="#636e72" stroke-width="2"/>
      <!-- Neck -->
      <line x1="150" y1="80" x2="150" y2="100" stroke="#636e72" stroke-width="2"/>
      <!-- Spine -->
      <line x1="150" y1="100" x2="150" y2="300" stroke="#636e72" stroke-width="2.5" stroke-dasharray="6,3"/>
      <!-- Collarbones -->
      <line x1="100" y1="110" x2="150" y2="105" stroke="#636e72" stroke-width="2"/>
      <line x1="200" y1="110" x2="150" y2="105" stroke="#636e72" stroke-width="2"/>
      <!-- Ribcage -->
      <ellipse cx="150" cy="175" rx="55" ry="70" fill="none" stroke="#636e72" stroke-width="1.5"/>
      <ellipse cx="150" cy="170" rx="45" ry="55" fill="none" stroke="#636e72" stroke-width="1"/>
      <ellipse cx="150" cy="165" rx="35" ry="40" fill="none" stroke="#636e72" stroke-width="1"/>
      <!-- Pelvis -->
      <path d="M110,290 Q115,320 135,330 L150,300 L165,330 Q185,320 190,290" fill="none" stroke="#636e72" stroke-width="2"/>
      <!-- Upper arms -->
      <line x1="100" y1="110" x2="80" y2="210" stroke="#636e72" stroke-width="2"/>
      <line x1="200" y1="110" x2="220" y2="210" stroke="#636e72" stroke-width="2"/>
      <!-- Lower arms - Speiche -->
      <line x1="80" y1="210" x2="65" y2="300" stroke="#636e72" stroke-width="1.8"/>
      <line x1="220" y1="210" x2="235" y2="300" stroke="#636e72" stroke-width="1.8"/>
      <!-- Lower arms - Elle -->
      <line x1="80" y1="210" x2="75" y2="300" stroke="#636e72" stroke-width="1.5"/>
      <line x1="220" y1="210" x2="225" y2="300" stroke="#636e72" stroke-width="1.5"/>
      <!-- Hands/Fingers -->
      <line x1="65" y1="300" x2="55" y2="330" stroke="#636e72" stroke-width="1"/>
      <line x1="65" y1="300" x2="62" y2="332" stroke="#636e72" stroke-width="1"/>
      <line x1="65" y1="300" x2="68" y2="334" stroke="#636e72" stroke-width="1"/>
      <line x1="75" y1="300" x2="74" y2="332" stroke="#636e72" stroke-width="1"/>
      <line x1="235" y1="300" x2="245" y2="330" stroke="#636e72" stroke-width="1"/>
      <line x1="235" y1="300" x2="238" y2="332" stroke="#636e72" stroke-width="1"/>
      <line x1="235" y1="300" x2="232" y2="334" stroke="#636e72" stroke-width="1"/>
      <line x1="225" y1="300" x2="226" y2="332" stroke="#636e72" stroke-width="1"/>
      <!-- Upper legs -->
      <line x1="135" y1="330" x2="120" y2="430" stroke="#636e72" stroke-width="2.5"/>
      <line x1="165" y1="330" x2="180" y2="430" stroke="#636e72" stroke-width="2.5"/>
      <!-- Kneecaps -->
      <circle cx="118" cy="435" r="8" fill="none" stroke="#636e72" stroke-width="1.5"/>
      <circle cx="182" cy="435" r="8" fill="none" stroke="#636e72" stroke-width="1.5"/>
      <!-- Lower legs - Schienbein -->
      <line x1="118" y1="443" x2="115" y2="545" stroke="#636e72" stroke-width="2"/>
      <line x1="182" y1="443" x2="185" y2="545" stroke="#636e72" stroke-width="2"/>
      <!-- Lower legs - Wadenbein -->
      <line x1="122" y1="443" x2="122" y2="545" stroke="#636e72" stroke-width="1.3"/>
      <line x1="178" y1="443" x2="178" y2="545" stroke="#636e72" stroke-width="1.3"/>
      <!-- Feet -->
      <path d="M108,545 L115,545 L125,565 L100,565 Z" fill="none" stroke="#636e72" stroke-width="1.5"/>
      <path d="M175,545 L185,545 L192,565 L170,565 Z" fill="none" stroke="#636e72" stroke-width="1.5"/>
    </svg>

    <!-- Label slots - left side -->
    <div class="label-slot left" style="top:5%; left:-10px;" data-answer="Sch&auml;del">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:17%; left:-10px;" data-answer="Schl&uuml;sselbein">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:27%; left:-20px;" data-answer="Oberarmknochen">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:42%; left:-20px;" data-answer="Speiche">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:48%; left:-20px;" data-answer="Elle">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:54%; left:-20px;" data-answer="Fingerknochen">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:72%; left:-10px;" data-answer="Kniescheibe">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot left" style="top:92%; left:-10px;" data-answer="Zehenknochen">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>

    <!-- Label slots - right side -->
    <div class="label-slot" style="top:28%; right:-20px;" data-answer="Brustkorb">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot" style="top:33%; right:-20px;" data-answer="Wirbels&auml;ule">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot" style="top:51%; right:-20px;" data-answer="Becken">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot" style="top:63%; right:-20px;" data-answer="Oberschenkelknochen">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot" style="top:80%; right:-20px;" data-answer="Schienbein">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
    <div class="label-slot" style="top:86%; right:-20px;" data-answer="Wadenbein">
      <div class="slot-line"></div>
      <div class="slot-box">?</div>
    </div>
  </div>

  <div id="progress"></div>
  <div id="congrats"></div>

  <div class="nav-links">
    <a href="./">&larr; Zur&uuml;ck</a>
  </div>
</div>

<script>
(function() {
  "use strict";

  var bones = [
    "Sch\u00e4del", "Schl\u00fcsselbein", "Oberarmknochen", "Speiche", "Elle",
    "Fingerknochen", "Brustkorb", "Wirbels\u00e4ule", "Becken",
    "Oberschenkelknochen", "Kniescheibe", "Schienbein", "Wadenbein", "Zehenknochen"
  ];

  // Decode HTML entities in data-answer attributes
  function decodeHTML(s) {
    var el = document.createElement("div");
    el.innerHTML = s;
    return el.textContent;
  }

  // Shuffle
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  document.addEventListener("DOMContentLoaded", function() {
    var bank = document.getElementById("wordBank");
    var slots = document.querySelectorAll(".label-slot");
    var progressEl = document.getElementById("progress");
    var congratsEl = document.getElementById("congrats");
    var selected = null;
    var solved = 0;
    var total = slots.length;

    function updateProgress() {
      progressEl.textContent = solved + " von " + total + " richtig";
      if (solved === total) {
        congratsEl.textContent = "Super, alle Knochen richtig zugeordnet!";
        congratsEl.classList.add("show");
      }
    }

    // Build word bank
    var shuffled = shuffle(bones.slice());
    shuffled.forEach(function(bone) {
      var el = document.createElement("div");
      el.className = "word";
      el.textContent = bone;
      el.dataset.bone = bone;
      el.addEventListener("click", function() {
        if (el.classList.contains("used")) return;
        // Deselect previous
        if (selected) selected.style.outline = "";
        if (selected === el) { selected = null; return; }
        selected = el;
        el.style.outline = "3px solid " + getComputedStyle(document.documentElement).getPropertyValue("--accent");
        el.style.outlineOffset = "2px";
      });
      bank.appendChild(el);
    });

    // Handle slot clicks
    slots.forEach(function(slot) {
      var box = slot.querySelector(".slot-box");
      var answer = decodeHTML(slot.dataset.answer);

      box.addEventListener("click", function() {
        if (box.classList.contains("correct")) return;
        if (!selected) return;

        var guess = selected.dataset.bone;

        if (guess === answer) {
          box.textContent = answer;
          box.classList.remove("wrong");
          box.classList.add("filled", "correct");
          selected.classList.add("used");
          selected.style.outline = "";
          selected = null;
          solved++;
          updateProgress();
        } else {
          box.classList.add("wrong");
          box.textContent = guess;
          box.classList.add("filled");
          setTimeout(function() {
            box.classList.remove("wrong", "filled");
            box.textContent = "?";
          }, 800);
          selected.style.outline = "";
          selected = null;
        }
      });
    });

    updateProgress();
  });
})();
</script>
</body>
</html>
